# /etc/nginx/sites-available/woven-pay-staging (symlinked into sites-enabled)
# Frontend static build. The API lives on woven-pay-staging-be.pradha.co.id.
server {
    listen 80;
    listen [::]:80;
    server_name woven-pay-staging.pradha.co.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name woven-pay-staging.pradha.co.id;

    ssl_certificate /etc/letsencrypt/live/woven-pay-staging.pradha.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woven-pay-staging.pradha.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/node/woven-payroll-staging/fe;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location ~* \.map$ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
